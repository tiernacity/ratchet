name: Test Ratchet Action

on:
  push:
    branches: [main, feat/better-tests-and-github-action]
  pull_request:
    branches: [main]

jobs:
  test-source:
    name: Test from source (uses ./)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test basic operation
        uses: ./
        with:
          metric: "echo 5"
          eq: main

  test-cross-platform:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test basic operation
        uses: ./
        with:
          metric: "echo 5"
          eq: main
